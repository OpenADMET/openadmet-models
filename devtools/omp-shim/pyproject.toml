[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omp-shim"
version = "0.1.0"
description = "Make LightGBM and XGBoost reuse the OpenMP runtime bundled with torch on macOS"
requires-python = ">=3.12"

[tool.hatch.build.targets.wheel]
packages = ["src/omp_shim"]

# The .pth file must sit at the wheel root (site-packages) so the interpreter runs it at startup
[tool.hatch.build.targets.wheel.force-include]
"omp_shim.pth" = "omp_shim.pth"

# Build the platform shim library when the wheel is built
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
