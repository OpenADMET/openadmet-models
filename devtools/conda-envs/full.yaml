# Full group (lock category full): the models, train, and report extras of pyproject.toml that infer does
# not already contain, as conda-forge packages
# Checked against pyproject.toml by devtools/scripts/lock_envs.py check
category: full
channels:
  - conda-forge
dependencies:
  # Models extra
  - catboost
  - lightgbm
  - xgboost
  # Train extra
  - intake-parquet
  - splito
  - zarr >=3.0.0
