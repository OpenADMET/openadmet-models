# Virtual packages assumed on machines that install the cpu and mps lock files
# Matches the conda-lock defaults except that CUDA is absent on linux-64 and macOS is 14.5 or newer
# because the mlx package, which tabpfn requires on Apple silicon, is not built for older macOS
subdirs:
  linux-64:
    packages:
      __unix: "0"
      __linux: "5.10"
      __archspec: "1 x86_64"
      __glibc: "2.28"
  osx-arm64:
    packages:
      __unix: "0"
      __archspec: "1 arm64"
      __osx: "14.5"
