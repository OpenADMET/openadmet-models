# Infer group (lock category main): the core dependencies plus the infer extra of pyproject.toml
# Package names are the conda-forge equivalents; chemprop, molfeat, and torch are installed elsewhere
# (pip-infer.txt and the hardware fragments)
# Checked against pyproject.toml by devtools/scripts/lock_envs.py check
category: main
channels:
  - conda-forge
dependencies:
  # Core dependencies
  - click
  - datamol
  - email-validator
  - fsspec
  - intake
  - jinja2
  - joblib
  - lightning <=2.6.1
  - loguru
  - numpy
  - pandas
  - phx-class-registry
  - pydantic
  - pytorch-lightning <=2.6.1
  - pyyaml
  # cuik_molmaker_pin in pip-infer.txt requires exactly this release
  - rdkit ==2026.03.6
  - rich
  - scikit-learn
  - scipy
  - setuptools <82.0.0
  # Infer extra
  - boto3
  - matplotlib-base
  - reportlab
  - seaborn-base
  - statsmodels
  - tabulate
  - uncertainty-toolbox
  # The lower bound stops the solver from choosing a 2022 release when only the upper bound is given
  - wandb >=0.25,<0.26.0
