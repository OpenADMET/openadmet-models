# Virtual packages assumed on machines that install the cuda lock files
# Matches the conda-lock defaults for linux-64 except __cuda, which declares a CUDA 12.4 driver
subdirs:
  linux-64:
    packages:
      __unix: "0"
      __linux: "5.10"
      __archspec: "1 x86_64"
      __glibc: "2.28"
      __cuda: "12.4"
