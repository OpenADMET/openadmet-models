# Adapter for pixi with the [tool.pixi.*] tables in pyproject.toml and pixi.lock (branch env/pixi)
schema = 1
name = "pixi"
status = "ready"
description = "pixi install --locked into a detached environment at {env_dir}; environments are named <group>-<hardware>-py<312|313>"

tool_version = ["pixi --version"]

# The time-travel phase is omitted: no workspace-level exclude-newer setting was found for conda packages in pixi 0.83
lock_check = "pixi lock --check"
lock = ["rm -f pixi.lock", "pixi lock"]

# The manifest path must match the one used by install because pixi derives the detached environment path from it
run_prefix = "pixi run --frozen --manifest-path {repo}/pyproject.toml -e {tool_group}-{hardware}-py{python_nodot}"

package_list = "pixi list --manifest-path {repo}/pyproject.toml -e {tool_group}-{hardware}-py{python_nodot} --json"
package_list_format = "conda-json"

# Global mode only: purges the real pixi cache, so the driver requires --yes-clear-cache
clear_cache = ["pixi clean cache --yes"]
cache_dirs = [
  "~/Library/Caches/rattler",
  "~/.cache/rattler",
]

# The detached environment lives in a hashed directory below {env_dir}, and only one environment is installed per run
env_location = "{env_dir}"

# The harness group full maps to the pixi dev environment (full plus test tools)
[group_aliases]
full = "dev"
infer = "infer"

# PIXI_HOME holds the config file written by the first install step, so the real ~/.pixi is never touched
[env]
PIXI_HOME = "{work_dir}/pixi-home"
PIXI_NO_PROGRESS = "true"

[isolated_env]
PIXI_CACHE_DIR = "{cache_dir}/pixi"
RATTLER_CACHE_DIR = "{cache_dir}/rattler"

[install.any.full]
note = "dev environment (core plus all extras plus test tools)"
steps = [
  "pixi config set --global detached-environments {env_dir}",
  "pixi install --locked --manifest-path {repo}/pyproject.toml -e {tool_group}-{hardware}-py{python_nodot}",
]

[install.any.infer]
note = "infer environment (core plus the infer extra)"
steps = [
  "pixi config set --global detached-environments {env_dir}",
  "pixi install --locked --manifest-path {repo}/pyproject.toml -e {tool_group}-{hardware}-py{python_nodot}",
]
