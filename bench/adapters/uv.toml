# Adapter for uv with pyproject.toml extras and uv.lock (branch env/uv)
schema = 1
name = "uv"
status = "ready"
description = "uv sync --locked from uv.lock with a managed interpreter, into a project environment at {env_dir}"

tool_version = ["uv --version"]

lock = "uv lock"
lock_check = "uv lock --check"
lock_asof = "uv lock --exclude-newer {date}T00:00:00Z"

# The harness runs this prefix from an empty directory, so the project is passed explicitly
run_prefix = "uv run --no-sync --project {repo}"

package_list = "uv pip freeze --python {env_dir}/bin/python"
package_list_format = "freeze"

# Global mode only: purges the real caches, so the driver requires --yes-clear-cache
clear_cache = ["uv cache clean"]
cache_dirs = [
  "~/Library/Caches/uv",
  "~/.cache/uv",
  "~/.local/share/uv/python",
]

env_location = "{env_dir}"

[env]
UV_PROJECT_ENVIRONMENT = "{env_dir}"
# Install the interpreter through uv so that it counts as part of the install, as conda does
UV_PYTHON_PREFERENCE = "only-managed"
UV_NO_PROGRESS = "1"

# Isolated mode redirects the wheel cache, git checkouts, and managed interpreters below the work dir
[isolated_env]
UV_CACHE_DIR = "{cache_dir}/uv"
UV_PYTHON_INSTALL_DIR = "{cache_dir}/uv-python"

# The cpu extra selects the CPU torch index on Linux and is a no-op on macOS; mps uses the PyPI wheel
[install.cpu.full]
note = "uv sync --locked --extra all --extra cpu (includes the default dev group with test tools)"
steps = ["uv sync --locked --python {python} --extra all --extra cpu"]

[install.cpu.infer]
note = "uv sync --locked --no-dev --extra infer --extra cpu"
steps = ["uv sync --locked --python {python} --no-dev --extra infer --extra cpu"]

[install.mps.full]
note = "uv sync --locked --extra all"
steps = ["uv sync --locked --python {python} --extra all"]

[install.mps.infer]
note = "uv sync --locked --no-dev --extra infer"
steps = ["uv sync --locked --python {python} --no-dev --extra infer"]

[install.cuda.full]
note = "uv sync --locked --extra all --extra cuda (CUDA 12.6 wheels)"
steps = ["uv sync --locked --python {python} --extra all --extra cuda"]

[install.cuda.infer]
note = "uv sync --locked --no-dev --extra infer --extra cuda (CUDA 12.6 wheels)"
steps = ["uv sync --locked --python {python} --no-dev --extra infer --extra cuda"]
