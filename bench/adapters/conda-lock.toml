# Adapter for conda-lock lock files installed with micromamba (branch env/conda-lock)
schema = 1
name = "conda-lock"
status = "ready"
description = "devtools/locks/*.yml installed by devtools/scripts/install_env.py into a prefix at {env_dir}"

# Only micromamba is listed because mamba 1.x cannot read these lock files
installers = ["micromamba"]

tool_version = ["{installer} --version"]

# conda-lock has no exclude-newer option, so the time-travel phase is omitted
# The lock commands run through uvx and need network access to fetch conda-lock
lock = "uvx --with pyyaml --with packaging python devtools/scripts/lock_envs.py lock --python {python} --hardware {hardware}"
lock_check = "uvx --with pyyaml --with packaging python devtools/scripts/lock_envs.py check --python {python} --hardware {hardware}"

run_prefix = "{installer} run -p {env_dir}"

package_list = "{installer} list -p {env_dir} --json"
package_list_format = "conda-json"

# Global mode only: purges the real caches, so the driver requires --yes-clear-cache
clear_cache = [
  "{installer} clean --all -y",
  { cmd = "{harness_python} -m pip cache purge", allow_failure = true },
]
cache_dirs = [
  "~/Library/Caches/pip",
  "~/.cache/pip",
  "~/.conda/pkgs",
  "~/micromamba/pkgs",
  "$MAMBA_ROOT_PREFIX/pkgs",
]

env_location = "{env_dir}"

# The harness group full maps to the dev lock category (full plus test tools)
[group_aliases]
full = "dev"
infer = "infer"

# Isolated mode redirects the conda package cache and the pip cache of the pip layer below the work dir
[isolated_env]
CONDA_PKGS_DIRS = "{cache_dir}/conda-pkgs"
MAMBA_ROOT_PREFIX = "{cache_dir}/mamba-root"
PIP_CACHE_DIR = "{cache_dir}/pip"

# One install table covers every cell: the script picks the lock file from the Python version and hardware
[install.any.any]
note = "install_env.py with --prefix; installs the lock categories of the group, then the pip layer, then the package without dependencies"
steps = [
  "{harness_python} devtools/scripts/install_env.py --python {python} --hardware {hardware} --group {tool_group} --prefix {env_dir} --installer {installer} --package regular",
]
