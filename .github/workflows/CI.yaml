name: CI

on:
  # GitHub has started calling new repo's first branch "main" https://github.com/github/renaming
  # The cookiecutter uses the "--initial-branch" flag when it runs git-init
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  schedule:
    # Weekly tests run on main by default:
    #   Scheduled workflows run on the latest commit on the default or base branch.
    #   (from https://help.github.com/en/actions/reference/events-that-trigger-workflows#scheduled-events-schedule)
    - cron: "0 0 * * 0"

jobs:
  test:
    name: Test on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macOS-latest, ubuntu-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a
          df -h
          ulimit -a

      - name: Select pixi environments
        id: pixi-env
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          tag="py${PYTHON_VERSION//./}"
          echo "dev=dev-cpu-${tag}" >> "$GITHUB_OUTPUT"
          echo "infer=infer-cpu-${tag}" >> "$GITHUB_OUTPUT"

      # More info on options: https://github.com/marketplace/actions/setup-pixi
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          manifest-path: pyproject.toml
          environments: ${{ steps.pixi-env.outputs.dev }} ${{ steps.pixi-env.outputs.infer }}
          locked: true
          cache: true

      - name: Smoke test the inference-only environment
        run: pixi run --locked -e ${{ steps.pixi-env.outputs.infer }} smoke-infer

      - name: Run unit tests
        env:
          OPENADMET_EXPECT_DEVICE: cpu
        run: pixi run --locked -e ${{ steps.pixi-env.outputs.dev }} test-unit


      - name: CodeCov
        uses: codecov/codecov-action@v5.4.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
