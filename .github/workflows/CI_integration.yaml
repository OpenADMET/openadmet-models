name: CI_integration_cpu

on:
  # GitHub has started calling new repo's first branch "main" https://github.com/github/renaming
  # The cookiecutter uses the "--initial-branch" flag when it runs git-init
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  schedule:
    # Weekly tests run on main by default:
    #   Scheduled workflows run on the latest commit on the default or base branch.
    #   (from https://help.github.com/en/actions/reference/events-that-trigger-workflows#scheduled-events-schedule)
    - cron: "0 0 * * 0"

jobs:
  test:
    name: Test on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a
          df -h
          ulimit -a

      - name: Select lock file
        id: lock
        shell: bash
        run: |
          echo "file=devtools/locks/py$(echo '${{ matrix.python-version }}' | tr -d .)-cpu-lock.yml" >> "$GITHUB_OUTPUT"

      # More info on options: https://github.com/marketplace/actions/setup-micromamba
      # The lock file installs exactly the locked packages; create-args only selects the dev group's lock categories
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ${{ steps.lock.outputs.file }}
          environment-name: openadmet-models
          cache-environment: true
          condarc: |
            channels:
              - conda-forge
          create-args: >-
            --category main
            --category full
            --category dev

      - name: Install pip layer and package
        # conda setup requires this special shell
        shell: bash -l {0}
        run: |
          python devtools/scripts/install_pip_layer.py --group dev
          python -m pip install . --no-deps
          python -m pip check
          micromamba list

      - name: Run CPU integration tests
        # conda setup requires this special shell
        shell: bash -l {0}
        # use the `-m cpu` marker to run only CPU tests
        env:
          OPENADMET_EXPECT_DEVICE: cpu
        run: |
          pytest -v -n auto -m cpu --cov=openadmet.models --cov-report=xml --durations=10 --color=yes openadmet/models/tests/integration


      - name: CodeCov
        uses: codecov/codecov-action@v5.4.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
