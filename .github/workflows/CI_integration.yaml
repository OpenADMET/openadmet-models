name: CI_integration_cpu

on:
  # GitHub has started calling new repo's first branch "main" https://github.com/github/renaming
  # The cookiecutter uses the "--initial-branch" flag when it runs git-init
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  schedule:
    # Weekly tests run on main by default:
    #   Scheduled workflows run on the latest commit on the default or base branch.
    #   (from https://help.github.com/en/actions/reference/events-that-trigger-workflows#scheduled-events-schedule)
    - cron: "0 0 * * 0"

# Each supported install route has its own job so that a failure names the route
jobs:
  test-pixi:
    name: Test with pixi on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a
          df -h
          ulimit -a

      - name: Select pixi environment
        id: pixi-env
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          echo "env=cpu-py${PYTHON_VERSION//./}" >> "$GITHUB_OUTPUT"

      # More info on options: https://github.com/marketplace/actions/setup-pixi
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          manifest-path: pyproject.toml
          environments: ${{ steps.pixi-env.outputs.env }}
          locked: true
          cache: true

      - name: Run CPU integration tests
        # the `cpu` marker selects only CPU tests, see test-integration-cpu in pyproject.toml
        run: pixi run --locked -e ${{ steps.pixi-env.outputs.env }} test-integration-cpu

      - name: CodeCov
        uses: codecov/codecov-action@v5.4.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: codecov-pixi-${{ matrix.os }}-py${{ matrix.python-version }}

  test-uv:
    name: Test with uv on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a
          df -h
          ulimit -a

      # More info on options: https://github.com/astral-sh/setup-uv
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install package
        run: uv sync --locked --extra test --extra cpu

      - name: Show installed packages
        run: uv pip list

      - name: Run CPU integration tests
        # use the `-m cpu` marker to run only CPU tests
        run: |
          uv run --no-sync pytest -v -n auto -m cpu --cov=openadmet.models --cov-report=xml --durations=10 --color=yes openadmet/models/tests/integration

      - name: CodeCov
        uses: codecov/codecov-action@v5.4.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: codecov-uv-${{ matrix.os }}-py${{ matrix.python-version }}

  # The conda environment file is a best-effort route on Python 3.12 only
  test-conda:
    name: Test with conda on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      # More info on options: https://github.com/marketplace/actions/setup-micromamba
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: devtools/conda-envs/openadmet-models.yaml
          environment-name: openadmet-models
          cache-environment: true
          condarc: |
            channels:
              - conda-forge
          create-args: >-
            python=${{ matrix.python-version }}

      - name: Install package
        # conda setup requires this special shell
        shell: bash -l {0}
        run: |
          python -m pip install . --no-deps
          micromamba list

      - name: Run CPU integration tests
        # conda setup requires this special shell
        shell: bash -l {0}
        # use the `-m cpu` marker to run only CPU tests
        run: |
          pytest -v -n auto -m cpu --cov=openadmet.models --cov-report=xml --durations=10 --color=yes openadmet/models/tests/integration

      - name: CodeCov
        uses: codecov/codecov-action@v5.4.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: codecov-conda-${{ matrix.os }}-py${{ matrix.python-version }}
