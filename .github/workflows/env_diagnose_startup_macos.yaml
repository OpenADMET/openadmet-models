name: Diagnose startup-time OpenMP sharing on macOS

# Probes how dyld resolves libomp after an in-process preload, and whether a local uv package can apply the fix.
# Trigger by pushing to env/diag/<anything>.

on:
  push:
    branches:
      - "env/diag/**"

permissions:
  contents: read

jobs:
  semantics:
    name: semantics, ${{ matrix.variant }}, Python ${{ matrix.python-version }}
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        variant: [nobrew, brew]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.7"
          enable-cache: false

      - name: Set up the system libomp for the variant
        shell: bash
        run: |
          if [ "${{ matrix.variant }}" = nobrew ]; then
            brew uninstall --ignore-dependencies libomp || true
          else
            brew install libomp
          fi
          ls -l "$(brew --prefix)/opt/libomp/lib" 2>&1 || echo "no Homebrew libomp"

      - name: Install the locked library versions
        run: |
          uv venv --python ${{ matrix.python-version }} /tmp/venv
          uv pip install --python /tmp/venv/bin/python numpy torch==2.14.1 scikit-learn==1.9.1 lightgbm==4.7.0 xgboost==3.4.1

      - name: Show load commands of the OpenMP users
        run: |
          site=$(/tmp/venv/bin/python -c "import sysconfig;print(sysconfig.get_paths()['purelib'])")
          for lib in "$site/torch/lib/libtorch_cpu.dylib" "$site/torch/lib/libomp.dylib" "$site/lightgbm/lib/lib_lightgbm.dylib" "$site/xgboost/lib/libxgboost.dylib" $(find "$site/sklearn" -name '*.so' | head -400); do
            if otool -L "$lib" | grep -q omp; then
              echo "== $lib"
              otool -L "$lib" | grep omp
              otool -l "$lib" | grep -A2 LC_RPATH | grep path
            fi
          done 2>&1 | awk '/^== /{n++} n<=12 || !/^==/{print}' | head -80
          sw_vers

      - name: Shim without any modification of installed files
        run: |
          site=$(/tmp/venv/bin/python -c "import sysconfig;print(sysconfig.get_paths()['purelib'])")
          mkdir -p "$site/omp_shim"
          sh bench/startup/build_shim.sh "$site" "$site/omp_shim"
          python3 -I bench/startup/orders.py /tmp/venv/bin/python shim "$site/omp_shim/libomp.dylib" | tee shim.md
          python3 -I bench/startup/orders.py /tmp/venv/bin/python control none | tee control.md
        continue-on-error: true

      - name: Repair only the lightgbm and xgboost rpaths
        run: |
          site=$(/tmp/venv/bin/python -c "import sysconfig;print(sysconfig.get_paths()['purelib'])")
          for lib in "$site/lightgbm/lib/lib_lightgbm.dylib" "$site/xgboost/lib/libxgboost.dylib"; do
            install_name_tool -add_rpath "@loader_path/../../torch/lib" "$lib"
            codesign --force --sign - "$lib"
          done
          python3 -I bench/startup/orders.py /tmp/venv/bin/python rpath-only none | tee rpath.md
        continue-on-error: true

      - name: Repair the rpaths and link the scikit-learn runtime
        run: |
          site=$(/tmp/venv/bin/python -c "import sysconfig;print(sysconfig.get_paths()['purelib'])")
          ln -sf "$site/torch/lib/libomp.dylib" "$site/sklearn/.dylibs/libomp.dylib"
          python3 -I bench/startup/orders.py /tmp/venv/bin/python rpath-and-sklearn-link none | tee rpath_sk.md
        continue-on-error: true
