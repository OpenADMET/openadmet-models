name: Diagnose uv unit tests on macOS

# Finds out why LightGBM dataset construction stalls when the uv environment runs on macOS and which
# variant fixes it. Trigger by pushing to env/diag/<anything>.

on:
  push:
    branches:
      - "env/diag/**"

permissions:
  contents: read

jobs:
  diagnose:
    name: macOS, ${{ matrix.variant }}
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: script-py3.12
            python: "3.12"
          - variant: script-py3.13
            python: "3.13"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: env/uv

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.7"
          enable-cache: false

      - name: Install libomp
        run: brew install libomp

      - name: Install the environment
        run: uv sync --locked --python ${{ matrix.python }} --extra all

      - name: Share one OpenMP runtime
        run: sh devtools/scripts/share_libomp_macos.sh

      - name: Show OpenMP runtimes in the environment
        run: |
          brew list --versions libomp
          find .venv -name '*omp*.dylib' | sort
          for lib in $(find .venv -name 'lib_lightgbm.dylib' -o -name 'libxgboost.dylib' -o -name 'libomp.dylib' | sort); do
            echo "== $lib"
            otool -L "$lib" | grep -i omp || true
            otool -l "$lib" | grep -A2 LC_RPATH | grep path || true
          done
          uv pip freeze --python .venv/bin/python | grep -i -E "^(lightgbm|xgboost|torch|scikit-learn)=="

      - name: Reproduce the stall outside pytest
        id: repro
        continue-on-error: true
        env:
          VARIANT_ENV_NAME: ${{ matrix.env_name }}
          VARIANT_ENV_VALUE: ${{ matrix.env_value }}
        run: |
          if [ -n "$VARIANT_ENV_NAME" ]; then export "$VARIANT_ENV_NAME=$VARIANT_ENV_VALUE"; fi
          cat > "$RUNNER_TEMP/repro.py" <<'EOF'
          import faulthandler, os, subprocess

          faulthandler.dump_traceback_later(90, exit=True)

          import numpy as np
          import sklearn
          import torch
          from rdkit import Chem
          import lightgbm
          import xgboost

          out = subprocess.run(["vmmap", str(os.getpid())], capture_output=True, text=True).stdout
          print(sorted({line.split()[-1] for line in out.splitlines() if "libomp" in line or "libiomp" in line}))

          n_jobs = int(os.environ["OPENADMET_DIAG_NJOBS"]) if "OPENADMET_DIAG_NJOBS" in os.environ else None
          rng = np.random.RandomState(0)
          X = rng.rand(5, 4)
          y = np.array([5.8, 5.6, 5.4, 5.2, 5.0])
          lightgbm.LGBMRegressor(n_estimators=2, num_leaves=2, verbose=-1, n_jobs=n_jobs).fit(X, y)
          print("lightgbm ok")
          xgboost.XGBRegressor(n_estimators=2, n_jobs=n_jobs).fit(X, y)
          print("xgboost ok")
          EOF
          uv run --no-sync python "$RUNNER_TEMP/repro.py"

      - name: Run the unit tests with stack dumps for stalled tests
        if: steps.repro.outcome == 'success' 
        timeout-minutes: 30
        env:
          PYTHONFAULTHANDLER: "1"
          VARIANT_ENV_NAME: ${{ matrix.env_name }}
          VARIANT_ENV_VALUE: ${{ matrix.env_value }}
        run: |
          if [ -n "$VARIANT_ENV_NAME" ]; then export "$VARIANT_ENV_NAME=$VARIANT_ENV_VALUE"; fi
          uv run --no-sync pytest openadmet/models/tests/unit -n 2 -v -o faulthandler_timeout=180 -p no:cacheprovider
