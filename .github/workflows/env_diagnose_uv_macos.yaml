name: Diagnose uv OpenMP sharing on macOS

# Compares ways to avoid several OpenMP runtimes in one process for the uv environment on macOS.
# Each variant installs the locked environment, applies one sharing method, probes pairs of libraries
# in several import orders, then runs the unit suite. Trigger by pushing to env/diag/<anything>.

on:
  push:
    branches:
      - "env/diag/**"

permissions:
  contents: read

jobs:
  diagnose:
    name: ${{ matrix.variant }}, Python ${{ matrix.python-version }}
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        variant:
          - none
          - brew-only
          - brew-relink
          - torch-loader
          - torch-rpath
          - preload-brew
          - preload-torch

    steps:
      - uses: actions/checkout@v4
        with:
          path: diag

      - uses: actions/checkout@v4
        with:
          ref: env/uv
          path: uv

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.7"
          enable-cache: false

      # Variants named none and torch-* must not rely on a system libomp
      - name: Set up the system libomp for the variant
        shell: bash
        run: |
          case "${{ matrix.variant }}" in
            none | torch-loader | torch-rpath | preload-torch)
              brew uninstall --ignore-dependencies libomp || true
              ;;
            *)
              brew install libomp
              ;;
          esac
          ls -l "$(brew --prefix)/opt/libomp/lib" 2>&1 || echo "no Homebrew libomp"

      - name: Install the environment
        working-directory: uv
        run: uv sync --locked --python ${{ matrix.python-version }} --extra all

      - name: Show the OpenMP libraries and rpaths before the variant
        working-directory: uv
        shell: bash
        run: |
          find .venv -name '*omp*.dylib' | sort
          for lib in $(find .venv -name 'lib_lightgbm.dylib' -o -name 'libxgboost.dylib' | sort); do
            echo "== $lib"
            otool -L "$lib" | grep -i omp || true
            otool -l "$lib" | grep -A2 LC_RPATH | grep path || true
          done

      - name: Apply the variant
        id: variant
        working-directory: uv
        shell: bash
        run: |
          sh ../diag/bench/diag/apply_variant.sh "${{ matrix.variant }}" "$PWD/.venv" | tee extra_env.txt
          while IFS= read -r line; do
            [ -n "$line" ] && echo "$line" >> "$GITHUB_ENV"
          done < extra_env.txt
          find .venv -name 'libomp.dylib' -exec ls -l {} +

      - name: Probe import orders
        working-directory: uv
        shell: bash
        run: |
          python3 -I ../diag/bench/diag/run_probe.py "$PWD/.venv/bin/python" | tee probe.md
          { echo "### ${{ matrix.variant }}, Python ${{ matrix.python-version }}"; sed -n '/^| import order/,$p' probe.md; } >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

      - name: Run the unit tests
        working-directory: uv
        timeout-minutes: 15
        env:
          PYTHONFAULTHANDLER: "1"
        run: uv run --no-sync pytest openadmet/models/tests/unit -n 0 -q -o faulthandler_timeout=180 -p no:cacheprovider
