name: Diagnose package choices for OpenMP on macOS

# Applies one package-choice variant to a copy of the env/uv project, locks and syncs it with no step
# after the sync, then probes import orders and runs the unit suite. Trigger by pushing to env/diag/pkgs.

on:
  push:
    branches:
      - "env/diag/pkgs"

permissions:
  contents: read

jobs:
  project:
    name: ${{ matrix.variant }}, Python ${{ matrix.python-version }}
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        variant: ["src-rpath", "torch210"]

    steps:
      - uses: actions/checkout@v4
        with:
          path: diag

      - uses: actions/checkout@v4
        with:
          ref: env/uv
          path: uv

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.7"
          enable-cache: false

      # The source build needs the libomp headers and library once; the run must not use Homebrew libomp
      - name: Set up the system libomp for the variant
        shell: bash
        run: |
          if [ "${{ matrix.variant }}" = src-rpath ]; then brew install libomp; else brew uninstall --ignore-dependencies libomp || true; fi

      - name: Apply the variant and lock
        working-directory: uv
        run: |
          python3 -I ../diag/bench/diag/apply_pkgs_variant.py "${{ matrix.variant }}" pyproject.toml
          git diff --stat
          uv lock
          git diff --stat uv.lock
          grep -A1 -E '^name = "(torch|lightgbm|xgboost|scikit-learn)"$' uv.lock | grep -E 'name|version'

      - name: Install the environment with no step afterwards
        working-directory: uv
        run: |
          start=$(date +%s)
          uv sync --locked --python ${{ matrix.python-version }} --extra all
          echo "SYNC_SECONDS=$(( $(date +%s) - start ))"

      - uses: actions/upload-artifact@v4
        with:
          name: lock-${{ matrix.variant }}-${{ matrix.python-version }}
          path: |
            uv/uv.lock
            uv/pyproject.toml

      - name: Remove Homebrew libomp so the run cannot use it
        run: brew uninstall --ignore-dependencies libomp || true

      - name: Show the OpenMP libraries and rpaths
        working-directory: uv
        shell: bash
        run: |
          find .venv -name '*omp*.dylib' | sort
          for lib in $(find .venv -name 'lib_lightgbm.dylib' -o -name 'libxgboost.dylib' | sort); do
            echo "== $lib"
            otool -L "$lib" | grep -Ei 'libi?omp' || true
            otool -l "$lib" | grep -A2 LC_RPATH | grep path || true
          done

      - name: Probe import orders without Homebrew libomp
        working-directory: uv
        shell: bash
        run: |
          python3 -I ../diag/bench/diag/run_probe.py "$PWD/.venv/bin/python" | tee probe.md
          { echo "### ${{ matrix.variant }}, Python ${{ matrix.python-version }}, no Homebrew libomp"; sed -n '/^| import order/,$p' probe.md; } >> "$GITHUB_STEP_SUMMARY"
        env:
          PROBE_TIMEOUT: "45"
        continue-on-error: true

      - name: Run the unit tests without Homebrew libomp
        working-directory: uv
        timeout-minutes: 20
        env:
          PYTHONFAULTHANDLER: "1"
        run: uv run --no-sync pytest openadmet/models/tests/unit -n 0 -q -o faulthandler_timeout=180 -p no:cacheprovider
        continue-on-error: true

      - name: Probe import orders with Homebrew libomp installed
        if: matrix.variant == 'torch210'
        working-directory: uv
        shell: bash
        run: |
          brew install libomp
          python3 -I ../diag/bench/diag/run_probe.py "$PWD/.venv/bin/python" | tee probe-brew.md
          { echo "### ${{ matrix.variant }}, Python ${{ matrix.python-version }}, Homebrew libomp"; sed -n '/^| import order/,$p' probe-brew.md; } >> "$GITHUB_STEP_SUMMARY"
        env:
          PROBE_TIMEOUT: "45"
        continue-on-error: true

      - name: Run the unit tests with Homebrew libomp installed
        if: matrix.variant == 'torch210'
        working-directory: uv
        timeout-minutes: 20
        env:
          PYTHONFAULTHANDLER: "1"
        run: uv run --no-sync pytest openadmet/models/tests/unit -n 0 -q -o faulthandler_timeout=180 -p no:cacheprovider
        continue-on-error: true
