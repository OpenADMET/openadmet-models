# This specification specifies the input data
data:
  # Specify the dataset file
  resource: "{{ANVIL_DIR}}/cyp_multitask.csv"
  type: intake
  # Specify input column containing SMILES
  input_col: OPENADMET_SMILES
  # Specify the target column that you're trying to predict
  target_cols:
  - cyp3a4_pchembl_value_mean
  dropna: true

# Additional metadata
metadata:
  authors: Sean
  biotargets:
  - CYP3A4
  build_number: 0
  description: per-block PCA over two aliased fingerprint blocks of the same featurizer type
  driver: sklearn
  email: sean@example.com
  name: pca_alias_concat_lgbm
  tag: openadmet-test-PCA-ALIAS-CONCAT
  tags:
  - openadmet
  - test
  - pca
  - alias
  version: v1

# Section specifying training procedure
procedure:
# Featurization specification, two featurizers of one type told apart by alias
  feat:
    type: FeatureConcatenator
    params:
      featurizers:
        - type: FingerprintFeaturizer
          alias: ecfp
          params:
            fp_type: "ecfp:4"
        - type: FingerprintFeaturizer
          alias: maccs
          params:
            fp_type: "maccs"

  # Reduce the wide ECFP block and pass the MACCS keys through as featurized
  transform:
    - type: PCATransform
      params:
        n_components:
          ecfp: 256
          maccs: null
        random_seed: 42

  # Model specification
  model:
    type: LGBMRegressorModel
    params:
      alpha: 0.005
      learning_rate: 0.05

  # Specify data splits
  split:
    type: ShuffleSplitter
    params:
      random_seed: 42
      train_size: 0.7
      val_size: 0.0
      test_size: 0.3

  train:
    type: SKLearnGridSearchTrainer
    params:
      param_grid:
        n_estimators: [200]
        alpha: [0.005]
        learning_rate: [0.05]

# Section specifying report generation
report:
  eval:
  - type: RegressionMetrics
    params: {}
